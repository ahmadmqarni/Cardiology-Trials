<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landmark Cardiology Trials</title>
  <meta name="description" content="A curated reference of landmark cardiology trials for Cardiology Fellows." />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── HEADER ──────────────────────────────────────────── -->
  <header id="site-header">
    <div class="header-inner">

      <div class="logo-area" style="cursor:pointer" data-nav="home">
        <span class="logo-icon">🫀</span>
        <div class="logo-text">
          <h1>Landmark Cardiology Trials</h1>
          <span>Cardiology Fellows Reference</span>
        </div>
      </div>

      <div class="search-wrap">
        <input
          id="search-input"
          type="search"
          placeholder="Search any trial, drug, or topic…"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="search-icon">🔍</span>
      </div>

      <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
        <span id="theme-icon">☀️</span>
      </button>

    </div>
  </header>

  <!-- ── BREADCRUMB ──────────────────────────────────────── -->
  <nav id="breadcrumb" aria-label="Breadcrumb"></nav>

  <!-- ── MAIN APP ────────────────────────────────────────── -->
  <main id="app"></main>

  <!-- ── MODAL OVERLAY ───────────────────────────────────── -->
  <div id="modal-overlay" role="dialog" aria-modal="true" aria-label="Trial details">
    <div id="modal-box"></div>
  </div>

  <!-- ── DATA + LOGIC ────────────────────────────────────── -->
  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
